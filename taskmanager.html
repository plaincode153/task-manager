<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>
        <h1>Task Manager</h1>

        <div class="task-manager">
            <div class="task-input">
                <input required minlength="2" id="task-input" type="text" placeholder="Enter a task">
                <button id="add-btn">Add</button>
            </div>
            <div class="task-input">
                <input id="date-input" type="date">

            </div>
            <div class="search-container">
                <input id="search-input" type="search" placeholder="Search tasks">
            </div>
            <div class="sort-container">
                <label for="sort-select">Sort by:</label>

                <select id="sort-select">
                    <option value="default">Default</option>
                    <option value="due-soonest">Due date: Soonest</option>
                    <option value="due-latest">Due date: Latest</option>
                </select>
            </div>
            <div id="edit-warning">
                <p class="red-color"></p>
            </div>

            <div id="task-list">
            </div>

        </div>

        <div class="filters">
            <button class="all-btn">All</button>
            <button class="active-btn">Active</button>
            <button class="complete-btn">Completed</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
