<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main>
        <h1>Task Manager</h1>

        <div class="task-manager">
            <div class="task-input">
                <input id="task-input" type="text" placeholder="Enter a task">
                <button id="add-btn">Add</button>
            </div>
            <div class="task-input">
                <input id="date-input" type="date">
            </div>
            <div id="edit-warning">
                    <p class="red-color"></p>
                </div>

            <div id="task-list">
            </div>

        </div>

        <div class="filters">
            <button class="all-btn all-color">All</button>
            <button class="active-btn green-color">Active</button>
            <button class="complete-btn yellow-color">Completed</button>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
